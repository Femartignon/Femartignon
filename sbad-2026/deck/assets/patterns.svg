<!-- ============================================================
     TAKEDA 2026 — PATTERN LIBRARY (SVG)
     Reconstrução fiel dos Takeda_Patterns_-_Master.
     Geometria amostrada dos PNGs oficiais (P2 período H≈403 / V≈186).

     4 famílias × 4 variações:
       Full      = linhas brancas sobre fundo escuro/cor
       Inverted  = linhas brancas + tick-marks VERMELHOS
       Gradient  = linhas brancas sobre gradiente (usar com gradients.css)
       Subtle    = linhas de baixa opacidade (textura discreta)

     Assinatura da marca: o "tick" lenticular (risco curto perpendicular)
     que cruza cada linha em intervalos regulares — sempre presente.

     COMO USAR:
       <svg ...><defs>…aqui…</defs>
         <rect width="100%" height="100%" fill="url(#tkd-p2)"/>
       </svg>
     Ou como background CSS via data-URI (ver SKILL.md).
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
<defs>

  <!-- O tick lenticular reutilizável (marca registrada do sistema) -->
  <g id="tkd-tick">
    <ellipse cx="0" cy="0" rx="2.2" ry="6" transform="rotate(28)"/>
  </g>

  <!-- ===== PATTERN 2 — SEIGAIHA / ESCAMAS =====
       Arcos concêntricos sobrepostos, DENSOS (escamas pequenas).
       Geometria fiel ao original: meia-onda horizontal ~67px, fileiras ~31px,
       arcos de raio modesto. tile = 134×62 (uma escama + offset).
       Linha bem fina. Escalar via patternTransform se quiser maior. -->
  <pattern id="tkd-p2" patternUnits="userSpaceOnUse" width="134" height="62" patternTransform="scale(1.5)">
    <g fill="none" stroke="#FFFFFF" stroke-width="0.9">
      <!-- fileira base -->
      <path d="M -33,62 A 33,31 0 0 1 33,62"/>
      <path d="M 33,62 A 33,31 0 0 1 99,62"/>
      <path d="M 99,62 A 33,31 0 0 1 165,62"/>
      <!-- fileira deslocada meia-largura (offset 33), topo -->
      <path d="M 0,31 A 33,31 0 0 1 66,31"/>
      <path d="M 66,31 A 33,31 0 0 1 132,31"/>
      <path d="M -66,31 A 33,31 0 0 1 0,31"/>
    </g>
    <g fill="#FFFFFF">
      <use href="#tkd-tick" x="33" y="33" transform="scale(0.55)"/>
      <use href="#tkd-tick" x="99" y="33" transform="scale(0.55)"/>
    </g>
  </pattern>

  <!-- PATTERN 2 INVERTED: mesma geometria, ticks vermelhos -->
  <pattern id="tkd-p2-inv" patternUnits="userSpaceOnUse" width="134" height="62" patternTransform="scale(1.5)">
    <g fill="none" stroke="#FFFFFF" stroke-width="0.9">
      <path d="M -33,62 A 33,31 0 0 1 33,62"/>
      <path d="M 33,62 A 33,31 0 0 1 99,62"/>
      <path d="M 99,62 A 33,31 0 0 1 165,62"/>
      <path d="M 0,31 A 33,31 0 0 1 66,31"/>
      <path d="M 66,31 A 33,31 0 0 1 132,31"/>
      <path d="M -66,31 A 33,31 0 0 1 0,31"/>
    </g>
    <g fill="#E1242A">
      <use href="#tkd-tick" x="33" y="33" transform="scale(0.55)"/>
      <use href="#tkd-tick" x="99" y="33" transform="scale(0.55)"/>
    </g>
  </pattern>

  <!-- ===== PATTERN 3 — ARCOS VERTICAIS PARALELOS =====
       Linhas longas curvas (raio grande), espaçadas ~150px.
       Ticks distribuídos ao longo das curvas. tile 150×400. -->
  <pattern id="tkd-p3" patternUnits="userSpaceOnUse" width="150" height="400">
    <g fill="none" stroke="#FFFFFF" stroke-width="1.4">
      <path d="M 30,-20 C 90,120 90,280 20,420"/>
      <path d="M 110,-20 C 170,120 170,280 100,420"/>
    </g>
    <g fill="#E1242A">
      <use href="#tkd-tick" x="78" y="120"/>
      <use href="#tkd-tick" x="60" y="300"/>
    </g>
  </pattern>

  <!-- ===== PATTERN 4 — FLOW LINES (ONDAS HORIZONTAIS) =====
       Linhas onduladas suaves, espaçamento vertical ~70px.
       Ticks vermelhos espalhados. tile 600×140. -->
  <pattern id="tkd-p4" patternUnits="userSpaceOnUse" width="600" height="140">
    <g fill="none" stroke="#FFFFFF" stroke-width="1.3">
      <path d="M -50,40  C 150,0 450,80 650,30"/>
      <path d="M -50,110 C 150,70 450,150 650,100"/>
    </g>
    <g fill="#E1242A">
      <use href="#tkd-tick" x="120" y="22" transform="rotate(-10 120 22)"/>
      <use href="#tkd-tick" x="430" y="58" transform="rotate(-10 430 58)"/>
      <use href="#tkd-tick" x="260" y="96" transform="rotate(-10 260 96)"/>
    </g>
  </pattern>

  <!-- gradiente reutilizável para variações "Gradient" -->
  <linearGradient id="tkd-grad-rb" x1="100%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"  stop-color="#E1242A"/>
    <stop offset="65%" stop-color="#C0303A"/>
    <stop offset="100%" stop-color="#A8BFD4"/>
  </linearGradient>

</defs>
</svg>
