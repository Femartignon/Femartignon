  :root{
    --takeda-red:#E1242A;
    --bg-1:#ffffff;
    --bg-2:#faf1ef;
    --text:#1A1A1A;
    --muted:#6b6f76;
    --chip-bg:#f3eeec;
    --chip-text:#5b4a48;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-1:#17181b;
      --bg-2:#241a1b;
      --text:#f5f3f2;
      --muted:#a8a4a2;
      --chip-bg:#2c2426;
      --chip-text:#e8dedc;
    }
  }
  /* Tom definido pela foto ativa (sobrepõe o modo do sistema) */
  [data-tone="light"]{
    --text:#1A1A1A;
    --muted:#3f444b;
    --accent:#E1242A;
    --chip-bg:rgba(255,255,255,.62);
    --chip-text:#3a2f2e;
    --divider:rgba(26,26,26,.14);
    --veil:linear-gradient(100deg,rgba(255,255,255,.80) 0%,rgba(255,255,255,.58) 50%,rgba(255,255,255,.40) 100%);
  }
  [data-tone="dark"]{
    --text:#ffffff;
    --muted:rgba(255,255,255,.80);
    --accent:#FF6B70;
    --chip-bg:rgba(255,255,255,.16);
    --chip-text:#ffffff;
    --divider:rgba(255,255,255,.22);
    --veil:linear-gradient(100deg,rgba(12,12,16,.72) 0%,rgba(12,12,16,.52) 55%,rgba(12,12,16,.40) 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg-1) 40%,var(--bg-2) 100%);
    color:var(--text);
    overflow:hidden;
    position:relative;
    isolation:isolate;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr;
    padding:11px 0 9px;
    border-top:4px solid var(--takeda-red);
  }
  /* Foto de fundo + véu */
  .bg,.veil{position:absolute;top:0;bottom:0;left:0;right:50%;z-index:-1;pointer-events:none;}
  .bg-layer{
    position:absolute;inset:0;
    background-size:cover;
    background-repeat:no-repeat;
    opacity:0;
    transition:opacity .8s ease;
  }
  .bg-layer.on{opacity:1;}
  .veil{background:var(--veil,transparent);transition:background .8s ease;}
  /* Metades */
  /* Cada metade é uma coluna independente, centralizada verticalmente */
  .pane{
    grid-row:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:7px;
    min-width:0;
    padding:0 13px;
    color:var(--text);
  }
  .pane + .pane{border-left:1px solid var(--divider,rgba(26,26,26,.10));}

  /* Metade direita: coluna própria (rótulo · dias · trânsito · rodapé) */
  #cdPane{display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .days{display:flex;align-items:center;gap:9px;}
  .days-txt{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .days-lbl{font-family:'Bebas Neue','Oswald',Impact,sans-serif;font-size:17px;letter-spacing:.06em;line-height:1;color:var(--text);}
  .days-date{font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .flipclock{display:flex;gap:6px;}
  .flip{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .card{
    --h:46px;
    position:relative;width:52px;height:var(--h);
    border-radius:6px;
    perspective:220px;
    box-shadow:0 3px 6px rgba(0,0,0,.22),0 1px 1px rgba(0,0,0,.12);
    font-family:'Bebas Neue','Oswald',Impact,sans-serif;
    font-size:43px;color:#1a1a1a;
    font-variant-numeric:tabular-nums;
  }
  .half{
    position:absolute;left:0;right:0;height:50%;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  .half b{display:block;height:var(--h);line-height:calc(var(--h) + 3px);text-align:center;font-weight:400;}
  .half.top{top:0;border-radius:6px 6px 0 0;background:linear-gradient(#fbfbfb,#e9e9e9);}
  .half.bottom{bottom:0;border-radius:0 0 6px 6px;background:linear-gradient(#e2e2e2,#d2d2d2);}
  .half.bottom b{transform:translateY(-50%);}
  /* dobradiça central + presilhas laterais */
  .card::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;margin-top:-.5px;
    background:rgba(0,0,0,.35);box-shadow:0 1px 0 rgba(255,255,255,.55);z-index:3;}
  .card::before{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:10px;margin-top:-5px;z-index:4;
    background:
      linear-gradient(90deg,#9a9a9a,#f2f2f2 50%,#9a9a9a) left/4px 100% no-repeat,
      linear-gradient(90deg,#9a9a9a,#f2f2f2 50%,#9a9a9a) right/4px 100% no-repeat;
    border-radius:1px;}
  .flap-top{transform-origin:50% 100%;animation:flipTop .28s ease-in forwards;z-index:2;}
  .flap-bottom{transform-origin:50% 0;transform:rotateX(90deg);animation:flipBottom .28s ease-out .28s forwards;z-index:2;}
  @keyframes flipTop{to{transform:rotateX(-90deg);}}
  @keyframes flipBottom{to{transform:rotateX(0);}}
  .flip-lbl{
    font-family:'Bebas Neue','Oswald',Impact,sans-serif;
    font-size:12px;letter-spacing:.14em;color:var(--muted);line-height:1;
  }
  @media (prefers-reduced-motion:reduce){.flap-top,.flap-bottom{animation-duration:0s;animation-delay:0s;}}
  /* Trânsito */
  .traffic{display:flex;flex-direction:column;gap:5px;padding-top:7px;border-top:1px solid var(--divider,rgba(26,26,26,.12));}
  .tr-title{font-family:'Gotham',-apple-system,sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .route{display:grid;grid-template-columns:34px 1fr auto;align-items:center;column-gap:7px;row-gap:2px;}
  .code{font-family:'Bebas Neue','Oswald',Impact,sans-serif;font-size:15px;line-height:1;letter-spacing:.04em;text-align:center;
    background:var(--text);color:var(--bg-1);border-radius:4px;padding:3px 0 2px;}
  .track{height:5px;border-radius:3px;background:rgba(127,127,127,.18);overflow:hidden;display:flex;}
  .track i{display:block;height:100%;}
  .mins{font-family:'Gotham',-apple-system,sans-serif;font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;text-align:right;}
  .mins small{font-size:9px;margin-left:1px;}
  .meta{grid-column:2 / 4;display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--muted);white-space:nowrap;}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .lv-ok{background:#2f8f5b;} .lv-mid{background:#d08a12;} .lv-bad{background:#E1242A;}
  .tr-foot{font-size:8.5px;color:var(--muted);opacity:.8;}
  .loc{
    font-family:'Gotham',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:700;
    font-size:11px;
    color:var(--accent,var(--takeda-red));
    text-transform:uppercase;
    letter-spacing:.05em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row{display:flex;align-items:center;gap:10px;min-width:0;}
  .icon-wrap{flex-shrink:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
  .icon-wrap svg{width:100%;height:100%;overflow:visible;}
  .main{min-width:0;}
  .temp{
    font-family:'Gotham',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:700;
    font-size:27px;
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    line-height:1.05;
  }
  .cond{
    font-size:12.5px;
    font-weight:500;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:1px;
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--chip-bg);
    color:var(--chip-text);
    border-radius:999px;
    padding:3px 8px 3px 6px;
    font-size:10.5px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .chip svg{width:11px;height:11px;flex-shrink:0;}
  .updated{font-size:8.5px;color:var(--muted);opacity:.65;margin-top:1px;}
  .pane .loc{
    white-space:normal;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    line-height:1.25;
    align-self:start;
  }
  [data-tone] .chip{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  [data-tone] .updated{opacity:.85;}
  /* Contagem regressiva */
  .cd-live{
    font-family:'Gotham',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:700;
    font-size:21px;
    line-height:1.1;
    color:var(--accent,var(--takeda-red));
  }
  @media (max-width:380px){
    .pane{padding:0 10px;}
    .icon-wrap{width:40px;height:40px;}
    .temp{font-size:23px;}
    .row{gap:7px;}
  }
  @media (max-width:190px){
    .icon-wrap{width:40px;height:40px;}
    .temp{font-size:21px;}
    .cond{display:none;}
    .chips{flex-direction:column;align-items:flex-start;gap:3px;}
  }
</style>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="veil" id="veil" aria-hidden="true"></div>

  <section class="pane" id="wxPane" aria-label="Clima agora">
  <div class="loc" id="loc">Grand Hyatt · Barra da Tijuca, RJ</div>
  <div class="row">
    <div class="icon-wrap" id="iconWrap"></div>
    <div class="main">
      <div class="temp" id="temp">--°</div>
      <div class="cond" id="cond">Carregando…</div>
    </div>
  </div>
  <div class="chips">
    <span class="chip" id="feelsChip">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 15.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm1.5-1.4V5a1.5 1.5 0 0 0-3 0v9.1a4 4 0 1 0 3 0Z" fill="#c0392b"/></svg>
      <span id="feelsVal">--</span>
    </span>
    <span class="chip" id="windChip">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 8h11a2.5 2.5 0 1 0-2.4-3.2M3 12h15a2.5 2.5 0 1 1-2.4 3.2M3 16h9a2 2 0 1 1-1.8 2.8" stroke="#5b7a99" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      <span id="windVal">--</span>
    </span>
  </div>
  <div class="updated" id="updated"></div>
  </section>

  <section class="pane" id="cdPane" aria-label="Contagem regressiva">
    <div class="loc">Encontro Infield 2026</div>
    <div class="days" id="cdDays">
      <div class="flipclock" id="cdClock" role="timer" aria-live="off">
        <div class="card" data-unit="d" data-name="dias" role="img"></div>
      </div>
      <div class="days-txt">
        <span class="days-lbl" id="cdDaysLbl">dias para o evento</span>
        <span class="days-date" id="cdDate"></span>
      </div>
    </div>
    <div class="traffic" id="traffic" aria-label="Trânsito até o hotel">
      <div class="tr-title">Trânsito até o hotel</div>
      <div id="trRoutes"></div>
      <div class="tr-foot" id="trFoot">Carregando…</div>
    </div>
  </section>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var LAT = parseFloat(params.get('lat')) || -23.0045;
  var LON = parseFloat(params.get('lon')) || -43.3187;
  var LABEL = params.get('label') || 'Grand Hyatt · Barra da Tijuca, RJ';
  var REFRESH_MS = 15 * 60 * 1000;
  var STORAGE_KEY = 'infield2026_weather_cache_v2';
  document.getElementById('loc').textContent = LABEL;

  // ---------- Ícones (SVG desenhados, sem emoji/dependência externa) ----------
  function grad(id, stops){
    return '<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">' +
      stops.map(function(s){ return '<stop offset="'+s[0]+'" stop-color="'+s[1]+'"/>'; }).join('') +
      '</linearGradient>';
  }
  var DEFS =
    '<defs>' +
    '<radialGradient id="gSun" cx="35%" cy="32%" r="70%">' +
      '<stop offset="0%" stop-color="#FFEDB0"/><stop offset="55%" stop-color="#FFC94A"/><stop offset="100%" stop-color="#F2971A"/>' +
    '</radialGradient>' +
    grad('gCloud', [['0%','#FFFFFF'],['100%','#D6DCE3']]) +
    grad('gCloudDark', [['0%','#9AA2AC'],['100%','#6E757F']]) +
    grad('gDrop', [['0%','#9CCBEE'],['100%','#4E93C9']]) +
    grad('gBolt', [['0%','#FFE38A'],['100%','#F5A623']]) +
    '<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">' +
      '<feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity="0.20"/>' +
    '</filter>' +
    '</defs>';

  function sun(cx, cy, r){
    var rays = '';
    for (var i=0;i<8;i++){
      var a = i * Math.PI/4;
      var x1 = cx + Math.cos(a) * (r+3), y1 = cy + Math.sin(a) * (r+3);
      var x2 = cx + Math.cos(a) * (r+9), y2 = cy + Math.sin(a) * (r+9);
      rays += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#FFC94A" stroke-width="3.2" stroke-linecap="round"/>';
    }
    return '<g filter="url(#soft)">' + rays +
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#gSun)"/>' +
      '<ellipse cx="'+(cx-r*0.32)+'" cy="'+(cy-r*0.38)+'" rx="'+(r*0.34)+'" ry="'+(r*0.2)+'" fill="#FFFFFF" opacity="0.4"/>' +
      '</g>';
  }
  function cloud(cx, cy, scale, dark){
    var fill = dark ? 'url(#gCloudDark)' : 'url(#gCloud)';
    var s = scale;
    return '<g filter="url(#soft)" transform="translate('+cx+' '+cy+') scale('+s+')">' +
      '<ellipse cx="-8" cy="6" rx="13" ry="9" fill="'+fill+'"/>' +
      '<circle cx="4" cy="-1" r="10.5" fill="'+fill+'"/>' +
      '<circle cx="-8" cy="-3" r="8.5" fill="'+fill+'"/>' +
      '<rect x="-15" y="2" width="29" height="11" rx="5.5" fill="'+fill+'"/>' +
      '</g>';
  }
  function drops(points, big){
    var r = big ? 3.4 : 2.6;
    return points.map(function(p){
      return '<path filter="url(#soft)" d="M'+p[0]+' '+(p[1]-r*1.8)+' C'+(p[0]+r)+' '+(p[1]-r*0.4)+' '+(p[0]+r)+' '+(p[1]+r*0.6)+' '+p[0]+' '+(p[1]+r*1.6)+' C'+(p[0]-r)+' '+(p[1]+r*0.6)+' '+(p[0]-r)+' '+(p[1]-r*0.4)+' '+p[0]+' '+(p[1]-r*1.8)+' Z" fill="url(#gDrop)"/>';
    }).join('');
  }
  function snow(points){
    return points.map(function(p){
      var lines = '';
      for (var i=0;i<3;i++){
        var a = i * Math.PI/3;
        var dx = Math.cos(a)*3.6, dy = Math.sin(a)*3.6;
        lines += '<line x1="'+(p[0]-dx)+'" y1="'+(p[1]-dy)+'" x2="'+(p[0]+dx)+'" y2="'+(p[1]+dy)+'" stroke="#BFE0F5" stroke-width="1.6" stroke-linecap="round"/>';
      }
      return lines;
    }).join('');
  }
  function bolt(cx, cy){
    return '<path filter="url(#soft)" transform="translate('+cx+' '+cy+')" d="M2,-10 L-7,4 L-1,4 L-3,14 L8,-2 L1,-2 Z" fill="url(#gBolt)"/>';
  }
  function fog(){
    var bars = [[0.58,-11,0.55],[0.98,-1,0.95],[0.5,9,0.7],[0.7,17,0.5]];
    return '<g filter="url(#soft)">' + bars.map(function(b){
      var w = 46*b[0];
      return '<rect x="'+(32-w/2)+'" y="'+(30+b[1])+'" width="'+w+'" height="5.5" rx="2.75" fill="url(#gCloud)" opacity="'+b[2]+'"/>';
    }).join('') + '</g>';
  }

  var ICONS = {
    clear:        function(){ return sun(32,32,15); },
    partlyCloudy: function(){ return sun(41,21,9) + cloud(27,38,1.15,false); },
    cloudy:       function(){ return cloud(22,40,0.92,true) + cloud(41,27,1.08,false); },
    fog:          function(){ return fog(); },
    drizzle:      function(){ return cloud(30,26,1.05,false) + drops([[21,47],[31,51],[41,47]], false); },
    rain:         function(){ return cloud(30,24,1.05,true) + drops([[19,46],[30,52],[41,46],[25,56],[36,56]], true); },
    storm:        function(){ return cloud(28,22,1.0,true) + bolt(31,38); },
    snow:         function(){ return cloud(30,26,1.0,false) + snow([[20,48],[31,52],[42,48]]); }
  };

  var WMO = {
    0:['clear','Céu limpo'], 1:['partlyCloudy','Poucas nuvens'], 2:['partlyCloudy','Parc. nublado'], 3:['cloudy','Nublado'],
    45:['fog','Neblina'], 48:['fog','Neblina'],
    51:['drizzle','Garoa fraca'], 53:['drizzle','Garoa'], 55:['drizzle','Garoa forte'],
    56:['drizzle','Garoa gelada'], 57:['drizzle','Garoa gelada'],
    61:['rain','Chuva fraca'], 63:['rain','Chuva'], 65:['rain','Chuva forte'],
    66:['rain','Chuva gelada'], 67:['rain','Chuva gelada'],
    71:['snow','Neve fraca'], 73:['snow','Neve'], 75:['snow','Neve forte'], 77:['snow','Grãos de neve'],
    80:['rain','Pancadas fracas'], 81:['rain','Pancadas de chuva'], 82:['storm','Pancadas fortes'],
    85:['snow','Pancadas de neve'], 86:['snow','Pancadas de neve'],
    95:['storm','Trovoada'], 96:['storm','Trovoada c/ granizo'], 99:['storm','Trovoada c/ granizo']
  };

  function renderIcon(key){
    var build = ICONS[key] || ICONS.clear;
    document.getElementById('iconWrap').innerHTML =
      '<svg viewBox="0 0 64 64">' + DEFS + build() + '</svg>';
  }

  // ---------- Foto de fundo por condição ----------
  // tone: define véu e cor do texto; pos: enquadramento da foto no card
  var PHOTOS = {
    'clear-day':     { tone:'light', pos:'center 58%' },
    'clear-night':   { tone:'dark',  pos:'center' },
    'partly-cloudy': { tone:'light', pos:'center 62%' },
    'fog':           { tone:'dark',  pos:'center 30%' },
    'rain':          { tone:'dark',  pos:'center 30%' },
    'storm':         { tone:'dark',  pos:'center 42%' }
  };
  function photoFor(iconKey, isDay){
    switch(iconKey){
      case 'clear':        return isDay ? 'clear-day' : 'clear-night';
      case 'partlyCloudy': return isDay ? 'partly-cloudy' : 'clear-night';
      case 'cloudy':       return 'partly-cloudy';
      case 'fog':          return 'fog';
      case 'drizzle':
      case 'rain':         return 'rain';
      case 'storm':        return 'storm';
      default:             return 'partly-cloudy';
    }
  }
  var currentPhoto = null;
  function setPhoto(key){
    if (key === currentPhoto) return;
    var p = PHOTOS[key];
    var bg = document.getElementById('bg');
    var img = new Image();
    img.onload = function(){
      currentPhoto = key;
      var layer = document.createElement('div');
      layer.className = 'bg-layer';
      layer.style.backgroundImage = 'url(img/' + key + '.webp)';
      layer.style.backgroundPosition = p.pos;
      bg.appendChild(layer);
      document.getElementById('wxPane').setAttribute('data-tone', p.tone);
      document.getElementById('veil').setAttribute('data-tone', p.tone);
      requestAnimationFrame(function(){ layer.classList.add('on'); });
      setTimeout(function(){
        while (bg.firstChild && bg.firstChild !== layer) bg.removeChild(bg.firstChild);
      }, 900);
    };
    img.src = 'img/' + key + '.webp';
  }

  function fmtTime(iso){
    var d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function render(data, fromCache){
    var w = WMO[data.code] || ['clear','—'];
    renderIcon(w[0]);
    setPhoto(photoFor(w[0], data.isDay !== 0));
    document.getElementById('temp').textContent = Math.round(data.temp) + '°C';
    document.getElementById('cond').textContent = w[1];
    document.getElementById('feelsVal').textContent = Math.round(data.feels) + '°C';
    document.getElementById('windVal').textContent = Math.round(data.wind) + ' km/h';
    document.getElementById('updated').textContent =
      (fromCache ? 'Último dado salvo · ' : 'Atualizado ') + fmtTime(data.time);
  }

  function showError(){
    try{
      var cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (cached){ render(cached, true); return; }
    }catch(e){}
    renderIcon('clear');
    document.getElementById('temp').textContent = '--°';
    document.getElementById('cond').textContent = 'Indisponível';
    document.getElementById('feelsVal').textContent = '--';
    document.getElementById('windVal').textContent = '--';
    document.getElementById('updated').textContent = 'Sem conexão';
  }

  function fetchOnce(){
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + LAT + '&longitude=' + LON
      + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day'
      + '&timezone=America%2FSao_Paulo';
    return fetch(url).then(function(r){
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(json){
      var c = json.current;
      return { temp:c.temperature_2m, feels:c.apparent_temperature, code:c.weather_code, wind:c.wind_speed_10m, isDay:c.is_day, time:c.time };
    });
  }

  function fetchWeather(){
    // Rede de venue pode ter instabilidade pontual: 1 nova tentativa antes de cair pro fallback.
    fetchOnce().catch(function(){
      return new Promise(function(resolve){ setTimeout(resolve, 3000); }).then(fetchOnce);
    }).then(function(data){
      render(data, false);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
    }).catch(showError);
  }

  // ---------- Contagem regressiva ----------
  var EVENT_START = new Date('2026-11-16T07:59:00-03:00'); // horário de Brasília
  var TZ = 'America/Sao_Paulo';
  function dayKey(d){ return d.toLocaleDateString('en-CA', { timeZone: TZ }); }
  document.getElementById('cdDate').textContent = '16 nov · 07:59';

  // Placa split-flap: metade de cima mostra o novo valor na hora;
  // a aba de cima (valor antigo) cai e a aba de baixo (valor novo) fecha.
  function half(cls, v){ return '<span class="half ' + cls + '" aria-hidden="true"><b>' + v + '</b></span>'; }
  function setCard(card, v){
    var old = card.getAttribute('data-v');
    if (old === v) return;
    card.setAttribute('data-v', v);
    card.setAttribute('aria-label', v + ' ' + card.getAttribute('data-name'));
    if (old === null){ card.innerHTML = half('top', v) + half('bottom', v); return; }
    card.innerHTML = half('top', v) + half('bottom', old) +
                     half('top flap-top', old) + half('bottom flap-bottom', v);
    var flap = card.querySelector('.flap-bottom');
    flap.addEventListener('animationend', function(){
      if (card.getAttribute('data-v') === v) card.innerHTML = half('top', v) + half('bottom', v);
    });
  }
  var dayCard = document.querySelector('.card[data-unit="d"]');
  function dayIndex(d){ var k = dayKey(d).split('-'); return Date.UTC(+k[0], +k[1]-1, +k[2]) / 86400000; }

  function tickCountdown(){
    var now = new Date();
    var days = dayIndex(EVENT_START) - dayIndex(now);   // dias de calendário (Brasília)
    if (days <= 0){
      var live = days === 0 ? 'É hoje!' : 'Evento realizado';
      var box = document.getElementById('cdDays');
      if (box) box.outerHTML = '<div class="cd-live">' + live + '</div>';
      return false;
    }
    setCard(dayCard, String(Math.min(99, days)).padStart(2,'0'));
    document.getElementById('cdDaysLbl').textContent = days === 1 ? 'dia para o evento' : 'dias para o evento';
    return true;
  }
  if (tickCountdown()){
    var cdTimer = setInterval(function(){ if (!tickCountdown()) clearInterval(cdTimer); }, 1000);
  }

  // ---------- Trânsito (TomTom via função do servidor) ----------
  var TRAFFIC_URL = '/api/transito';
  var TRAFFIC_REFRESH_MS = 5 * 60 * 1000;
  var LEVEL = { ok:['lv-ok','Livre'], mid:['lv-mid','Moderado'], bad:['lv-bad','Intenso'] };
  function renderTraffic(data){
    document.getElementById('trRoutes').innerHTML = data.routes.map(function(r){
      var lv = LEVEL[r.level] || LEVEL.ok;
      var bar = (r.segments && r.segments.length ? r.segments : [{ share:1, level:r.level }]).map(function(sg){
        return '<i class="' + (LEVEL[sg.level] || LEVEL.ok)[0] + '" style="width:' + (sg.share * 100).toFixed(1) + '%"></i>';
      }).join('');
      var delay = r.delayMin > 0 ? ' · +' + r.delayMin + ' min' : '';
      return '<div class="route" aria-label="' + r.code + ': ' + r.minutes + ' minutos, ' + lv[1] + '">' +
        '<span class="code">' + r.code + '</span><span class="track">' + bar + '</span>' +
        '<span class="mins">' + r.minutes + '<small>min</small></span>' +
        '<span class="meta"><span class="dot ' + lv[0] + '"></span>' + lv[1] + delay + '</span></div>';
    }).join('');
    document.getElementById('trFoot').textContent = 'Atualizado ' + fmtTime(data.updated) + ' · dados © TomTom';
  }
  function fetchTraffic(){
    fetch(TRAFFIC_URL).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(renderTraffic)
      .catch(function(){ document.getElementById('trFoot').textContent = 'Trânsito indisponível no momento'; });
  }
  fetchTraffic();
  setInterval(fetchTraffic, TRAFFIC_REFRESH_MS);

  renderIcon('clear');
  fetchWeather();
  setInterval(fetchWeather, REFRESH_MS);
})();
</script>
</body>
</html>
