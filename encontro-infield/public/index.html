  --ink-2: #55575F;
  --control: #83858C;
  --accent-text: #E1242A;
  --red-fill: #E1242A;
  --font: "Gotham", "Montserrat", "Proxima Nova", "Helvetica Neue", Arial, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s10: 40px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --bead-red: radial-gradient(circle at 34% 30%, #ffffffb3 0 14%, transparent 16%),
              radial-gradient(circle at 40% 36%, #ff6a6e, #E1242A 52%, #9f1519 100%);
  --bead-grey: radial-gradient(circle at 34% 30%, #ffffffa6 0 14%, transparent 16%),
               radial-gradient(circle at 40% 36%, #c3c4c9, #8e9096 52%, #55575e 100%);
  /* tamanhos ajustados pelo código para caber na altura do widget (título 24 → 19 px, texto 14 → 13 px) */
  --t: 24px;
  --b: 14px;
  --bl: 20px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--b)/var(--bl) var(--font);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
p, h1, ol { margin: 0; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* ---------- cartão: kicker · título · texto · fio · datas ---------- */
.card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  height: 100%;
  padding: var(--s4) var(--s4) var(--s3);
  display: grid;
  grid-template-rows: auto auto 1fr auto auto;
}

/* canto do KV: véu cinza, fios e contas na faixa do kicker; some antes da linha do título */
.canto {
  position: absolute;
  z-index: -1;
  top: calc(-1 * var(--s10));
  right: calc(-1 * var(--s2));
  width: clamp(120px, 38%, 168px);
  height: auto;
  pointer-events: none;
  -webkit-mask-image: radial-gradient(125% 95% at 100% 0, #000 38%, transparent 74%);
  mask-image: radial-gradient(125% 95% at 100% 0, #000 38%, transparent 74%);
}

.kicker {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding-right: var(--s8);
  font: 700 12px/16px var(--font);
  letter-spacing: .04em;
  color: var(--ink-2);
}
.kicker::before {
  content: "";
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--bead-red);
  box-shadow: 0 1px 1px #35373E33;
}

.title {
  margin-top: var(--s2);
  font: 700 var(--t)/1.2 var(--font);
  letter-spacing: -.02em;
  color: var(--ink);
  text-wrap: balance;
}
.title .c { font-weight: 400; }
.title .r { color: var(--accent-text); }

.text {
  margin-top: var(--s2);
  font: 400 var(--b)/var(--bl) var(--font);
  color: var(--ink-2);
  text-wrap: balance;
}

/* ---------- trilha: o fio da história (prólogo, 4 capítulos e epílogo) ----------
   Desenho do KV: fio fino em onda suave que entra pela borda esquerda, passa pelo centro de cada conta
   e sai pela direita (o código traça a onda conforme a largura).
   fio cinza = a história inteira · fio vermelho = até hoje (no epílogo, segue para fora do cartão)
   conta grafite = passou · conta vermelha = agora · anel = ainda vem */
.trilha {
  position: relative;
  height: var(--s6);
  margin-top: var(--s3);
}
/* reserva sem JavaScript: fio reto entre a primeira e a última conta */
.trilha::before {
  content: "";
  position: absolute;
  top: 50%;
  left: calc(100% / 12);
  right: calc(100% / 12);
  height: 2px;
  border-radius: 2px;
  transform: translateY(-50%);
  background: #35373E29;
}
.trilha[data-tracado]::before { display: none; }
.linha {
  position: absolute;
  top: 0;
  left: calc(-1 * var(--s4));
  width: calc(100% + 2 * var(--s4));
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.linha path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.linha-base { stroke: #83858C; stroke-opacity: .6; stroke-width: 1.5px; }
.linha-feita { stroke: var(--red-fill); stroke-width: 2px; }
.fio {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  align-items: center;
  height: 100%;
  padding: 0;
  list-style: none;
}
.conta {
  position: relative;
  justify-self: center;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--control);
  transform: translateY(var(--y, 0px));
}
.conta[data-s="passada"] { border: 0; background: var(--bead-grey); box-shadow: 0 1px 2px #35373E40; }
.conta[data-s="agora"] {
  width: 14px; height: 14px; border: 0;
  background: var(--bead-red);
  box-shadow: 0 0 0 3px var(--bg), 0 1px 3px #35373E59;
}

/* datas sob as contas: a de hoje em grafite Bold (vermelho não tem contraste para 12 px) */
.rotulos {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  margin-top: var(--s1);
  padding: 0;
  list-style: none;
  font: 400 12px/16px var(--font);
  text-align: center;
  white-space: nowrap;
  color: var(--ink-2);
}
.rotulos [data-s="agora"] { font-weight: 700; color: var(--ink); }
/* último recurso quando nem o menor tamanho cabe na altura: as datas saem (o kicker diz o capítulo) */
.card[data-compacto] .rotulos { display: none; }

/* ---------- movimento: entra em foco e para antes de 5 s (WCAG 2.2.2: o widget não tem pausa) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .card[data-anim] .title { animation: foco .9s var(--ease) both; }
  .card[data-anim] .text { animation: sobe .6s var(--ease) .2s both; }
  /* o fio vermelho se desenha da borda esquerda até a conta de hoje (--len = comprimento, medido pelo código) */
  .card[data-anim] .linha-feita {
    stroke-dasharray: var(--len, 0) var(--len, 0);
    animation: fio 1s var(--ease) .3s both;
  }
  .card[data-anim] .conta[data-s="agora"] { animation: pulso 1.6s ease-out 1.1s 2; }
  @keyframes foco { from { filter: blur(8px); opacity: 0; } to { filter: blur(0); opacity: 1; } }
  @keyframes sobe { from { opacity: 0; translate: 0 4px; } to { opacity: 1; translate: 0 0; } }
  @keyframes fio { from { stroke-dashoffset: var(--len, 0); } to { stroke-dashoffset: 0; } }
  @keyframes pulso {
    from { box-shadow: 0 0 0 3px var(--bg), 0 0 0 3px #E1242A73, 0 1px 3px #35373E59; }
    to { box-shadow: 0 0 0 3px var(--bg), 0 0 0 12px #E1242A00, 0 1px 3px #35373E59; }
  }
}

@media (forced-colors: active) {
  .conta, .linha, .trilha::before, .kicker::before { forced-color-adjust: none; }
}
</style>
</head>

    return Date.now();
  }

  function estadoAtual() {
    if (qa && qa.estado) {
      const forcado = DATA.estados.concat(DATA.espacos.filter(preenchido)).find((s) => s.id === qa.estado);
      if (forcado) return forcado;
    }
    return escolher(agora());
  }

  // *vermelho* e _conectivo_; o resto em Bold grafite (mesmas classes .r e .c das páginas)
  function tituloEmNos(marcacao) {
    const frag = doc.createDocumentFragment();
    marcacao.split(/(\*[^*]+\*|_[^_]+_)/).forEach((parte) => {
      if (!parte) return;
      const cls = parte[0] === '*' ? 'r' : parte[0] === '_' ? 'c' : '';
      if (cls && parte.length > 2 && parte[parte.length - 1] === parte[0]) {
        const span = doc.createElement('span');
        span.className = cls;
        span.textContent = parte.slice(1, -1);
        frag.appendChild(span);
      } else {
        frag.appendChild(doc.createTextNode(parte));
      }
    });
    return frag;
  }

  function textoProgresso(p) {
    if (p <= 0) return 'Prólogo: antes do primeiro capítulo do Encontro, de 16 a 19/11.';
    if (p >= ULTIMO) return 'Epílogo: depois do último capítulo do Encontro.';
    return `Capítulo ${p} de ${ULTIMO - 1} do Encontro, ${DATA.rotulos[p]}.`;
  }

  // maior tamanho que cabe na altura; se nem o menor couber, tira as datas do fio e tenta de novo
  function ajustar() {
    for (const compacto of [false, true]) {
      card.toggleAttribute('data-compacto', compacto);
      for (const [t, b, bl] of TAMANHOS) {
        root.style.setProperty('--t', `${t}px`);
        root.style.setProperty('--b', `${b}px`);
        root.style.setProperty('--bl', `${bl}px`);
        if (card.scrollHeight <= card.clientHeight + 1) {
          card.dataset.ajuste = `${t}/${b}${compacto ? '/compacto' : ''}`;
          return true;
        }
      }
    }
    card.dataset.ajuste = 'estouro';
    return false;
  }

  // Catmull-Rom → Bézier cúbica. Desenha do ponto 0 até o ponto 'ate' usando os vizinhos da lista inteira,
  // para o trecho vermelho cair exatamente sobre o fio cinza.
  function curva(p, ate) {
    const n = (v) => v.toFixed(1);
    let d = `M${n(p[0][0])} ${n(p[0][1])}`;
    for (let i = 0; i < ate; i++) {
      const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
      d += ` C${n(b[0] + (c[0] - a[0]) / 6)} ${n(b[1] + (c[1] - a[1]) / 6)}`
        + ` ${n(c[0] - (e[0] - b[0]) / 6)} ${n(c[1] - (e[1] - b[1]) / 6)} ${n(c[0])} ${n(c[1])}`;
    }
    return d;
  }

  // o fio entra pela borda esquerda do cartão, passa pelo centro de cada conta e sai pela direita;
  // vermelho até a conta de hoje (no epílogo, até a borda: a história continua)
  let passo = 0;
  function tracar() {
    const caixa = el.linha.getBoundingClientRect();
    if (!caixa.width || !caixa.height || el.contas.length < 2) return;
    const meio = caixa.height / 2;
    const xs = el.contas.map((c) => {
      const r = c.getBoundingClientRect();
      return r.left + r.width / 2 - caixa.left;
    });
    const vao = xs[1] - xs[0];
    const pontos = [[0, meio + onda(-xs[0] / vao)]]
      .concat(xs.map((x, i) => [x, meio + onda(i)]))
      .concat([[caixa.width, meio + onda((caixa.width - xs[0]) / vao)]]);
    el.contas.forEach((c, i) => c.style.setProperty('--y', `${onda(i).toFixed(2)}px`));
    el.base.setAttribute('d', curva(pontos, pontos.length - 1));
    el.feita.setAttribute('d', curva(pontos, passo >= ULTIMO ? pontos.length - 1 : passo + 1));
    el.feita.style.setProperty('--len', el.feita.getTotalLength().toFixed(1));
    el.trilha.dataset.tracado = '';
  }

  function animar() {
    card.removeAttribute('data-anim');
    void card.offsetWidth; // reinicia as animações de entrada
    card.setAttribute('data-anim', '');
  }

  let mostrado = null;
  function desenhar() {
    const st = estadoAtual();
    if (!st) return;
    const novo = st !== mostrado;
    if (novo) {
      mostrado = st;
      el.kicker.textContent = st.kicker;
      el.titulo.replaceChildren(tituloEmNos(st.titulo));
      el.texto.textContent = st.texto;
      passo = Math.max(0, Math.min(ULTIMO, Number(st.passo) || 0));
      const marca = (no, i) => { no.dataset.s = i < passo ? 'passada' : i === passo ? 'agora' : 'futura'; };
      el.contas.forEach(marca);
      el.rotulos.forEach(marca);
      el.progresso.textContent = textoProgresso(passo);
      card.dataset.estado = st.id;
    }
    ajustar();
    tracar();
    if (novo) animar();
  }

  let relogio = 0;
  function agendar() {
    clearTimeout(relogio);
    if (qa && (qa.now || qa.estado)) return; // QA congela o horário
    const t = Date.now();
    const prox = proximaFronteira(t);
    if (prox === null) return;
    relogio = setTimeout(() => { desenhar(); agendar(); }, Math.min(prox - t + 500, MAX_TIMER));
  }

  let quadro = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(quadro);
    quadro = requestAnimationFrame(() => { ajustar(); tracar(); });
  });
  doc.addEventListener('visibilitychange', () => {
    if (!doc.hidden) { desenhar(); agendar(); }
  });
  addEventListener('hashchange', () => { qa = lerQA(); desenhar(); agendar(); });
  // timers ficam congelados com o app em segundo plano: confere de novo a cada 5 min
  setInterval(desenhar, 5 * 60 * 1000);

  const iniciar = () => {
    desenhar();
    agendar();
    doc.body.dataset.pronto = '1';
  };
  (doc.fonts && doc.fonts.ready ? doc.fonts.ready : Promise.resolve()).then(iniciar, iniciar);
})();
</script>
</body>
</html>
