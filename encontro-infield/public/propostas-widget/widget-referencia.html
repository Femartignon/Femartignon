<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encontro Infield 2026 — Widget (referência)</title>
<style>
  @font-face{font-family:'Gotham';font-weight:400;font-style:normal;src:url(../fonts/gotham-book.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:500;font-style:normal;src:url(../fonts/gotham-medium.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:700;font-style:normal;src:url(../fonts/gotham-bold.otf) format('opentype');font-display:swap;}
  :root{
    --red:#E1242A;
    --blue-deep:#1B6FB8;
    --blue-sky:#41B7F5;
    --ink:#0B2545;
    --body:#1A1A1A;
    --muted:#5C636E;
    --line:#DDE3EA;
    --paper:#F4F6F8;
    --ok:#2F8F5B;
    --mid:#D08A12;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Gotham',Montserrat,'Helvetica Neue',Arial,sans-serif;
    background:#FFFFFF;color:var(--body);overflow:hidden;
    display:grid;grid-template-columns:41% 1fr;grid-template-rows:1fr 1fr;
  }
  .cell{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 12px;}

  /* Azul: contagem (topo esquerda) */
  .count{
    grid-column:1;grid-row:1;color:#FFFFFF;justify-content:flex-start;padding-top:10px;
    background:linear-gradient(160deg,var(--blue-deep) 0%,#2A8FD6 100%);
  }
  .kick-row{display:flex;align-items:center;gap:5px;font-size:7px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;}
  .kick-row i{display:block;width:16px;height:1.5px;background:var(--red);flex:none;}
  .kick-row span:last-child{letter-spacing:.08em;}
  .num{font-weight:700;font-size:58px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px;}
  .lbl{font-weight:500;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;}

  /* Azul: clima (base esquerda) */
  .weather{
    grid-column:1;grid-row:2;color:#FFFFFF;
    background:linear-gradient(170deg,#2A8FD6 0%,var(--blue-deep) 100%);
  }
  .wx-top{display:flex;align-items:center;gap:8px;}
  .wx-top svg{width:34px;height:34px;flex:none;}
  .wx-place{font-size:8.5px;opacity:.95;white-space:nowrap;}
  .temp{font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;margin-top:2px;}
  .temp sup{font-size:13px;vertical-align:top;}
  .cond{font-weight:500;font-size:10px;margin-top:2px;}
  .wx-foot{margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,.45);font-size:8.5px;}

  /* Papel: trânsito (topo direita) */
  .transit{grid-column:2;grid-row:1;background:var(--paper);border-bottom:1px solid var(--line);justify-content:flex-start;padding-top:10px;}
  .tr-head{display:flex;align-items:center;gap:7px;padding-bottom:5px;border-bottom:1px solid var(--line);}
  .tr-head svg{width:16px;height:16px;flex:none;color:var(--ink);}
  .tr-title{font-weight:700;font-size:10px;color:var(--ink);white-space:nowrap;}
  .tr-status{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:500;color:var(--mid);white-space:nowrap;}
  .tr-status b{width:6px;height:6px;border-radius:50%;background:var(--mid);display:block;}
  .tr-upd{display:none;}
  .route{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;column-gap:6px;padding:4px 0;border-bottom:1px solid var(--line);}
  .route:last-child{border-bottom:0;}
  .code{font-weight:700;font-size:9.5px;letter-spacing:.04em;line-height:1;background:var(--ink);color:#FFFFFF;border-radius:4px;padding:4px 6px 3px;}
  .to{font-size:8px;color:var(--muted);white-space:nowrap;}
  .bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:#E1E6EC;min-width:30px;}
  .bar i{display:block;height:100%;}
  .lv-ok{background:var(--ok);} .lv-mid{background:var(--mid);} .lv-bad{background:var(--red);}
  .mins{font-weight:700;font-size:14px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;}
  .mins small{font-size:8.5px;font-weight:500;margin-left:1px;}

  /* Papel: guia (base direita) */
  .guide{grid-column:2;grid-row:2;background:var(--paper);justify-content:flex-start;padding-top:10px;}
  .g-head{display:flex;align-items:center;gap:7px;padding-bottom:5px;border-bottom:1px solid var(--line);}
  .g-head svg{width:16px;height:16px;flex:none;color:var(--ink);}
  .g-title{font-weight:700;font-size:10.5px;color:var(--ink);}
  .g-item{display:grid;grid-template-columns:58px 1px 1fr;column-gap:7px;align-items:center;padding:2px 0;}
  .g-item + .g-item{border-top:1px solid transparent;}
  .g-sep{width:1px;align-self:stretch;background:var(--line);}
  .g-k{font-weight:700;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .g-v{font-size:9.5px;line-height:1.25;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .g-item.red .g-k{color:var(--red);}
  .g-rule{border-top:1px solid var(--line);margin:3px 0 0;}
</style>
</head>
<body>

  <section class="cell count" aria-label="Contagem regressiva">
    <div class="kick-row"><span>Encontro</span><i></i><span>16 a 19 nov</span></div>
    <div class="num" id="num">--</div>
    <div class="lbl" id="lbl">dias para o encontro</div>
  </section>

  <section class="cell transit" aria-label="Trânsito até o hotel">
    <div class="tr-head">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v2H3zM7 16v2M17 16v2M6 11h12" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="7.5" cy="13.5" r="1" fill="currentColor"/><circle cx="16.5" cy="13.5" r="1" fill="currentColor"/></svg>
      <span class="tr-title">Trânsito até o Grand Hyatt</span>
      <span class="tr-status" id="trStatus"><b></b><span id="trLevel">--</span></span>
      <span class="tr-upd" id="trUpd"></span>
    </div>
    <div id="routes"></div>
  </section>

  <section class="cell weather" aria-label="Clima em Barra da Tijuca">
    <div class="wx-top">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true" id="icon"></svg>
      <div>
        <div class="wx-place">Barra da <b>Tijuca</b> · agora</div>
        <div class="temp"><span id="temp">--</span><sup>°</sup></div>
      </div>
    </div>
    <div class="cond" id="cond">Carregando…</div>
    <div class="wx-foot" id="wxFoot">Sensação -- · chuva -- mm</div>
  </section>

  <section class="cell guide" aria-label="Guia rápido do hotel">
    <div class="g-head">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5M3 11h6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span class="g-title">Guia rápido do hotel</span>
    </div>
    <div class="g-item"><span class="g-k">15h</span><span class="g-sep"></span><span class="g-v">Check-in no hotel</span></div>
    <div class="g-item"><span class="g-k">12h</span><span class="g-sep"></span><span class="g-v">Check-out</span></div>
    <div class="g-item"><span class="g-k">Chegada</span><span class="g-sep"></span><span class="g-v">Credenciamento no hotel</span></div>
    <div class="g-rule"></div>
    <div class="g-item red"><span class="g-k">17–18/11</span><span class="g-sep"></span><span class="g-v">Vacina de dengue · Lagoa 4</span></div>
  </section>

<script>
(function(){
  var DEMO = /[?&]demo=1/.test(location.search);
  var DAY = 864e5;
  var EVENT = Date.UTC(2026,10,16);
  var END = Date.UTC(2026,10,19);
  var LAT = -23.0045, LON = -43.3187;
  var LV = { ok:'Livre', mid:'Moderado', bad:'Intenso' };

  /* ---------- Contagem ---------- */
  function todayBR(){
    var p = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var g = function(t){ return +p.find(function(x){ return x.type === t; }).value; };
    return Date.UTC(g('year'), g('month') - 1, g('day'));
  }
  var today = todayBR();
  var num = document.getElementById('num');
  var lbl = document.getElementById('lbl');
  if (today < EVENT){
    num.textContent = Math.round((EVENT - today) / DAY);
    lbl.textContent = 'dias para o encontro';
  } else if (today <= END){
    num.textContent = Math.round((today - EVENT) / DAY) + 1;
    lbl.textContent = 'dia de 4 do encontro';
  } else {
    num.textContent = '—';
    lbl.textContent = 'encontro realizado';
  }

  /* ---------- Trânsito ---------- */
  var SAMPLE_TR = {
    updated: new Date().toISOString(),
    routes: [
      { code:'GIG', minutes:52, level:'mid',
        segments:[{level:'ok',share:.35},{level:'mid',share:.30},{level:'bad',share:.12},{level:'ok',share:.23}] },
      { code:'SDU', minutes:44, level:'ok',
        segments:[{level:'ok',share:.7},{level:'mid',share:.2},{level:'ok',share:.1}] }
    ]
  };
  function renderTransit(data){
    document.getElementById('routes').innerHTML = data.routes.map(function(r){
      var bar = r.segments.map(function(s){
        return '<i class="lv-' + s.level + '" style="width:' + (s.share * 100) + '%"></i>';
      }).join('');
      return '<div class="route"><span class="code">' + r.code + '</span>' +
        '<span class="to">→ Grand Hyatt</span>' +
        '<div class="bar">' + bar + '</div>' +
        '<span class="mins">' + r.minutes + '<small>min</small></span></div>';
    }).join('');
    var worst = data.routes.reduce(function(a, r){ return a === 'bad' || r.level === 'bad' ? 'bad' : (a === 'mid' || r.level === 'mid' ? 'mid' : 'ok'); }, 'ok');
    var st = document.getElementById('trStatus');
    st.querySelector('b').style.background = worst === 'ok' ? 'var(--ok)' : (worst === 'mid' ? 'var(--mid)' : 'var(--red)');
    st.style.color = worst === 'ok' ? 'var(--ok)' : (worst === 'mid' ? 'var(--mid)' : 'var(--red)');
    document.getElementById('trLevel').textContent = LV[worst];
    document.getElementById('trUpd').textContent = 'Atualizado ' +
      new Date(data.updated).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
  }
  function failTransit(){
    document.getElementById('routes').innerHTML = '';
    document.getElementById('trLevel').textContent = 'Indisponível';
    document.getElementById('trUpd').textContent = '';
  }
  function loadTransit(){
    fetch('/api/transito', { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(renderTransit)
      .catch(failTransit);
  }

  /* ---------- Clima ---------- */
  var ICON_SUN = '<circle cx="18" cy="18" r="8" fill="#FFC94A"/><path d="M18 2v5M18 29v5M2 18h5M29 18h5M6.1 6.1l3.5 3.5M26.4 26.4l3.5 3.5M6.1 29.9l3.5-3.5M26.4 9.6l3.5-3.5" stroke="#FFC94A" stroke-width="2" stroke-linecap="round"/>';
  var ICON_CLOUD = '<path d="M16 40h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2 7 7 0 0 0-1 18Z" fill="#FFFFFF"/>';
  var ICON_RAIN = '<path d="M16 32h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2 7 7 0 0 0-1 18Z" fill="#D6DEE8"/><path d="M18 36l-2 6M26 36l-2 6M34 36l-2 6" stroke="#9CCFE6" stroke-width="2" stroke-linecap="round"/>';
  function describe(code){
    if (code === 0) return ['Céu limpo', ICON_SUN];
    if (code <= 2) return ['Parcialmente nublado', ICON_SUN + ICON_CLOUD];
    if (code === 3) return ['Nublado', ICON_CLOUD];
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return ['Chuva', ICON_RAIN];
    return ['Nublado', ICON_CLOUD];
  }
  function renderWeather(c){
    var d = describe(c.weather_code);
    document.getElementById('temp').textContent = Math.round(c.temperature_2m);
    document.getElementById('cond').textContent = d[0];
    document.getElementById('icon').innerHTML = d[1];
    document.getElementById('wxFoot').textContent =
      'Sensação ' + Math.round(c.apparent_temperature) + '° · chuva ' + c.precipitation.toFixed(1).replace('.', ',') + ' mm';
  }
  function loadWeather(){
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,apparent_temperature,precipitation,weather_code&timezone=America%2FSao_Paulo';
    fetch(url, { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ renderWeather(j.current); })
      .catch(function(){ document.getElementById('cond').textContent = 'Clima indisponível'; });
  }

  if (DEMO){
    renderTransit(SAMPLE_TR);
    renderWeather({ temperature_2m:23.4, apparent_temperature:23.1, precipitation:0, weather_code:2 });
  } else {
    loadTransit();
    loadWeather();
    setInterval(loadTransit, 5 * 60 * 1000);
    setInterval(loadWeather, 15 * 60 * 1000);
  }
})();
</script>
</body>
</html>
