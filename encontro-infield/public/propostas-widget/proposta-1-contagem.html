<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta 1 — Contagem</title>
<style>
  @font-face{font-family:'Gotham';font-weight:400;font-style:normal;src:url(../fonts/gotham-book.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:500;font-style:normal;src:url(../fonts/gotham-medium.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:700;font-style:normal;src:url(../fonts/gotham-bold.otf) format('opentype');font-display:swap;}
  :root{
    --red:#E1242A;
    --ink:#111111;
    --body:#1A1A1A;
    --muted:#5C636E;
    --line:#E4E7EB;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Gotham',Montserrat,'Helvetica Neue',Arial,sans-serif;
    background:#FFFFFF;color:var(--body);overflow:hidden;
  }
  .w{display:grid;grid-template-columns:40% 1fr;height:100%;}

  /* Bloco vermelho: contagem */
  .hero{
    position:relative;display:flex;flex-direction:column;justify-content:center;
    padding:0 14px;color:#FFFFFF;min-width:0;
    background:
      radial-gradient(120% 120% at 4% 98%,#9CCFE6 0%,rgba(156,207,230,0) 40%),
      linear-gradient(150deg,#F4292F 0%,#E1242A 55%,#8B0000 100%);
  }
  .num{font-weight:700;font-size:80px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .lbl{margin-top:10px;font-weight:500;font-size:12px;line-height:1.25;}

  /* Coluna de informação */
  .info{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 14px;min-width:0;}
  .kick{font-weight:500;font-size:10px;color:var(--muted);}
  .title{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;line-height:1.15;color:var(--ink);}
  .title svg{height:28px;width:auto;flex:none;}
  .meta{font-size:11px;line-height:1.3;color:var(--body);padding-left:15px;}

  /* Linha do tempo do encontro (16 a 19/11) */
  .track{position:relative;margin-top:10px;height:4px;background:var(--line);border-radius:2px;}
  .track i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:2px;}
  .ticks{display:grid;grid-template-columns:repeat(4,1fr);margin-top:5px;font-size:9.5px;color:var(--muted);}
  .ticks span:last-child{text-align:right;}
  .foot{font-size:8.5px;color:var(--muted);}
</style>
</head>
<body>
  <div class="w">
    <section class="hero" aria-label="Contagem regressiva">
      <div class="num" id="num">--</div>
      <div class="lbl" id="lbl">dias para o<br>Encontro Infield</div>
    </section>

    <section class="info" aria-label="Próximo compromisso">
      <div class="kick" id="kick">Próximo · previsto</div>
      <div class="title">
        <svg viewBox="0 0 40 120" aria-hidden="true"><path d="M4,2 C30,18 38,48 38,60 C38,72 30,102 4,118 L4,2 Z" fill="#E1242A"/></svg>
        <span id="title">Plenária de abertura</span>
      </div>
      <div class="meta" id="meta">16/11 · 14h30 · Grand Ballroom</div>
      <div class="track" aria-hidden="true"><i id="fill"></i></div>
      <div class="ticks"><span>16</span><span>17</span><span>18</span><span>19 nov</span></div>
      <div class="foot">Agenda oficial no app</div>
    </section>
  </div>

<script>
(function(){
  var DAY = 864e5;
  var EVENT = Date.UTC(2026,10,16);
  var END = Date.UTC(2026,10,19);

  // Data de hoje em Brasília, como dia UTC para contar dias sem fuso
  function todayBR(){
    var p = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var g = function(t){ return +p.find(function(x){ return x.type === t; }).value; };
    return Date.UTC(g('year'), g('month') - 1, g('day'));
  }

  // Compromisso por dia do encontro (previsto: vem de conhecimento.md)
  var NEXT = [
    { t:'Plenária de abertura', m:'16/11 · 14h30 · Grand Ballroom' },
    { t:'Abertura de BUs e World Café', m:'17/11 · Salas de Produtos e jantar livre à noite' },
    { t:'Jantar e festa de encerramento', m:'18/11 · no hotel' },
    { t:'Atividades finais e saída', m:'19/11 · transfer conforme horário enviado na véspera' }
  ];

  var today = todayBR();
  var n = document.getElementById('num');
  var l = document.getElementById('lbl');
  var k = document.getElementById('kick');
  var t = document.getElementById('title');
  var m = document.getElementById('meta');
  var f = document.getElementById('fill');

  if (today < EVENT){
    n.textContent = Math.round((EVENT - today) / DAY);
    l.innerHTML = 'dias para o<br>Encontro Infield';
    k.textContent = 'Próximo · previsto';
    t.textContent = NEXT[0].t; m.textContent = NEXT[0].m;
    f.style.width = '0%';
  } else if (today <= END){
    var idx = Math.round((today - EVENT) / DAY);
    n.textContent = idx + 1;
    l.innerHTML = 'dia de 4 do<br>encontro';
    k.textContent = 'Hoje · previsto';
    t.textContent = NEXT[idx].t; m.textContent = NEXT[idx].m;
    f.style.width = (idx / 3 * 100) + '%';
  } else {
    n.textContent = '—';
    l.innerHTML = 'Encontro<br>realizado';
    k.textContent = 'Obrigado pela participação';
    t.textContent = 'Encontro Infield 2026';
    m.textContent = '16 a 19 de novembro';
    f.style.width = '100%';
  }
})();
</script>
</body>
</html>
