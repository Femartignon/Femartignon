<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta 4 — Clima e agasalho</title>
<style>
  @font-face{font-family:'Gotham';font-weight:400;font-style:normal;src:url(../fonts/gotham-book.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:500;font-style:normal;src:url(../fonts/gotham-medium.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:700;font-style:normal;src:url(../fonts/gotham-bold.otf) format('opentype');font-display:swap;}
  :root{
    --red:#E1242A;
    --ink:#111111;
    --body:#1A1A1A;
    --muted:#5C636E;
    --card:#EEF1F4;
    --tint:#FBE9EA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Gotham',Montserrat,'Helvetica Neue',Arial,sans-serif;
    background:
      radial-gradient(120% 120% at 96% 4%,#9CCFE6 0%,rgba(156,207,230,0) 34%),
      linear-gradient(160deg,#FFFFFF 0%,#FBDCDD 42%,#F5C2C4 100%);
    color:var(--body);overflow:hidden;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;
    padding:12px 14px 10px;column-gap:12px;row-gap:8px;
    border-top:4px solid var(--red);
  }
  .main{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .kick{font-weight:500;font-size:10px;color:var(--muted);}
  .temp{font-weight:700;font-size:58px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px;}
  .temp sup{font-size:24px;vertical-align:top;margin-left:2px;}
  .cond{display:flex;align-items:center;gap:6px;margin-top:4px;font-weight:500;font-size:12px;color:var(--body);}
  .cond svg{width:20px;height:20px;flex:none;}

  .tiles{display:grid;grid-template-rows:1fr 1fr;gap:6px;min-width:0;}
  .tile{background:rgba(255,255,255,.78);border-radius:8px;padding:6px 9px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .tile .k{font-size:9.5px;color:var(--muted);line-height:1.2;}
  .tile .v{font-weight:700;font-size:17px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;}

  .tip{
    grid-column:1 / -1;display:flex;align-items:center;gap:8px;
    background:var(--red);color:#FFFFFF;border-radius:8px;padding:7px 10px;
  }
  .tip svg{width:16px;height:16px;flex:none;}
  .tip span{font-weight:500;font-size:10.5px;line-height:1.25;}
  .tip b{font-weight:700;}
</style>
</head>
<body>
  <section class="main" aria-label="Clima em Barra da Tijuca">
    <div class="kick" id="kick">Barra da Tijuca · agora</div>
    <div class="temp"><span id="temp">--</span><sup>°</sup></div>
    <div class="cond"><span id="icon"></span><span id="cond">Carregando…</span></div>
  </section>

  <section class="tiles" aria-label="Detalhes do clima">
    <div class="tile"><div class="k">Sensação térmica</div><div class="v" id="feels">--°</div></div>
    <div class="tile"><div class="k">Chuva agora</div><div class="v" id="rain">-- mm</div></div>
  </section>

  <div class="tip" role="note">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v18M5 8l14 8M19 8 5 16" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span><b>Salas refrigeradas:</b> leve um agasalho nos dias de programação</span>
  </div>

<script>
(function(){
  var DEMO = /[?&]demo=1/.test(location.search);
  var LAT = -23.0045, LON = -43.3187; // Grand Hyatt
  var URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,apparent_temperature,precipitation,weather_code&timezone=America%2FSao_Paulo';
  var REFRESH_MS = 15 * 60 * 1000;

  // Ícones simples por condição
  var SUN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#FFC94A"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="#F2971A" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var CLOUD = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.6A3.2 3.2 0 0 0 7 18Z" fill="#B7C0CC"/></svg>';
  var RAIN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.6A3.2 3.2 0 0 0 7 14Z" fill="#8A95A3"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3" stroke="#4E93C9" stroke-width="1.6" stroke-linecap="round"/></svg>';

  // Código WMO → rótulo e ícone
  function describe(code){
    if (code === 0) return ['Céu limpo', SUN];
    if (code <= 2) return ['Parcialmente nublado', SUN];
    if (code === 3) return ['Nublado', CLOUD];
    if (code >= 51 && code <= 67 || code >= 80 && code <= 82) return ['Chuva', RAIN];
    if (code >= 95) return ['Trovoada', RAIN];
    return ['Nublado', CLOUD];
  }

  function fmt(n){ return String(Math.round(n)); }
  function render(c){
    var d = describe(c.weather_code);
    document.getElementById('temp').textContent = fmt(c.temperature_2m);
    document.getElementById('feels').textContent = fmt(c.apparent_temperature) + '°';
    document.getElementById('rain').textContent = c.precipitation.toFixed(1).replace('.', ',') + ' mm';
    document.getElementById('cond').textContent = d[0];
    document.getElementById('icon').innerHTML = d[1];
  }

  if (DEMO){
    render({ temperature_2m:23.4, apparent_temperature:23.1, precipitation:0, weather_code:2 });
    return;
  }
  function load(){
    fetch(URL, { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ render(j.current); })
      .catch(function(){ document.getElementById('cond').textContent = 'Clima indisponível'; });
  }
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
