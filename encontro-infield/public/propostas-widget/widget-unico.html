<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encontro Infield 2026 — Widget</title>
<style>
  @font-face{font-family:'Gotham';font-weight:400;font-style:normal;src:url(../fonts/gotham-book.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:500;font-style:normal;src:url(../fonts/gotham-medium.otf) format('opentype');font-display:swap;}
  @font-face{font-family:'Gotham';font-weight:700;font-style:normal;src:url(../fonts/gotham-bold.otf) format('opentype');font-display:swap;}
  :root{
    --red:#E1242A;
    --ink:#111111;
    --body:#1A1A1A;
    --muted:#5C636E;
    --line:#E4E7EB;
    --card:#EEF1F4;
    --ok:#2F8F5B;
    --mid:#D08A12;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Gotham',Montserrat,'Helvetica Neue',Arial,sans-serif;
    background:#FFFFFF;color:var(--body);overflow:hidden;
    display:grid;grid-template-columns:40% 1fr;grid-template-rows:1fr 1fr;
    border-top:4px solid var(--red);
  }
  .cell{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 12px;}
  .kick{font-weight:500;font-size:9.5px;color:var(--muted);line-height:1.2;}

  /* 1 · Contagem (topo esquerda, bloco vermelho) */
  .count{
    grid-column:1;grid-row:1;color:#FFFFFF;
    background:
      radial-gradient(120% 120% at 4% 98%,#9CCFE6 0%,rgba(156,207,230,0) 40%),
      linear-gradient(150deg,#F4292F 0%,#E1242A 55%,#8B0000 100%);
  }
  .count .kick{color:#FFFFFF;opacity:.92;}
  .num{font-weight:700;font-size:50px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;}
  .count .lbl{font-weight:500;font-size:10.5px;line-height:1.25;margin-top:2px;}

  /* 4 · Clima (base esquerda) */
  .weather{grid-column:1;grid-row:2;background:linear-gradient(160deg,#FFFFFF 0%,#FBDCDD 60%,#F5C2C4 100%);}
  .wx-row{display:flex;align-items:center;gap:8px;}
  .wx-row svg{width:26px;height:26px;flex:none;}
  .temp{font-weight:700;font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
  .temp sup{font-size:13px;vertical-align:top;}
  .cond{font-weight:500;font-size:9.5px;line-height:1.25;color:var(--body);margin-top:3px;}
  .wx-meta{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.3;}

  /* 3 · Trânsito (topo direita) */
  .transit{grid-column:2;grid-row:1;border-bottom:1px solid var(--line);}
  .route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:7px;padding:3px 0;}
  .code{font-weight:700;font-size:9.5px;letter-spacing:.04em;line-height:1;background:var(--ink);color:#FFFFFF;border-radius:3px;padding:3px 5px 2px;}
  .bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);}
  .bar i{display:block;height:100%;}
  .lv-ok{background:var(--ok);} .lv-mid{background:var(--mid);} .lv-bad{background:var(--red);}
  .mins{font-weight:700;font-size:13px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;}
  .mins small{font-size:8.5px;font-weight:500;margin-left:1px;}
  .tr-foot{font-size:8.5px;color:var(--muted);line-height:1.2;}

  /* 5 · Guia rápido (base direita) */
  .guide{grid-column:2;grid-row:2;}
  .g-title{font-weight:700;font-size:10px;color:var(--ink);margin-bottom:4px;}
  .g-item{display:grid;grid-template-columns:62px 1fr;column-gap:6px;align-items:baseline;padding:2px 0;}
  .g-k{font-weight:700;font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .g-v{font-size:9.5px;line-height:1.25;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .g-item.red .g-k{color:var(--red);}
</style>
</head>
<body>

  <section class="cell count" aria-label="Contagem regressiva">
    <div class="kick" id="cKick">Encontro Infield 2026</div>
    <div class="num" id="num">--</div>
    <div class="lbl" id="lbl">dias para o encontro</div>
  </section>

  <section class="cell transit" aria-label="Trânsito até o hotel">
    <div class="kick" style="margin-bottom:2px">Trânsito até o Grand Hyatt</div>
    <div id="routes"></div>
    <div class="tr-foot" id="trFoot">Carregando…</div>
  </section>

  <section class="cell weather" aria-label="Clima em Barra da Tijuca">
    <div class="kick">Barra da Tijuca · agora</div>
    <div class="wx-row" style="margin-top:3px">
      <span id="icon"></span>
      <span class="temp"><span id="temp">--</span><sup>°</sup></span>
    </div>
    <div class="cond" id="cond">Carregando…</div>
    <div class="wx-meta" id="wxMeta">Sensação -- · chuva -- mm</div>
  </section>

  <section class="cell guide" aria-label="Guia rápido do hotel">
    <div class="g-title">Guia rápido do hotel</div>
    <div class="g-item"><span class="g-k">15h</span><span class="g-v">Check-in no hotel</span></div>
    <div class="g-item"><span class="g-k">12h</span><span class="g-v">Check-out</span></div>
    <div class="g-item"><span class="g-k">Chegada</span><span class="g-v">Credenciamento no hotel</span></div>
    <div class="g-item red"><span class="g-k">17–18/11</span><span class="g-v">Vacina de dengue · Lagoa 4</span></div>
  </section>

<script>
(function(){
  var DEMO = /[?&]demo=1/.test(location.search);
  var DAY = 864e5;
  var EVENT = Date.UTC(2026,10,16);
  var END = Date.UTC(2026,10,19);
  var LAT = -23.0045, LON = -43.3187;
  var LV = { ok:'Livre', mid:'Moderado', bad:'Intenso' };

  /* ---------- 1 · Contagem ---------- */
  function todayBR(){
    var p = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var g = function(t){ return +p.find(function(x){ return x.type === t; }).value; };
    return Date.UTC(g('year'), g('month') - 1, g('day'));
  }
  var today = todayBR();
  var num = document.getElementById('num');
  var lbl = document.getElementById('lbl');
  var kick = document.getElementById('cKick');
  if (today < EVENT){
    num.textContent = Math.round((EVENT - today) / DAY);
    lbl.textContent = 'dias para o encontro';
    kick.textContent = '16 a 19 de novembro';
  } else if (today <= END){
    num.textContent = Math.round((today - EVENT) / DAY) + 1;
    lbl.textContent = 'dia de 4 do encontro';
    kick.textContent = 'Encontro em andamento';
  } else {
    num.textContent = '—';
    lbl.textContent = 'encontro realizado';
    kick.textContent = 'Encontro Infield 2026';
  }

  /* ---------- 3 · Trânsito ---------- */
  var SAMPLE_TR = {
    updated: new Date().toISOString(),
    routes: [
      { code:'GIG', minutes:52, normalMin:41, delayMin:11, level:'mid',
        segments:[{level:'ok',share:.35},{level:'mid',share:.30},{level:'bad',share:.12},{level:'ok',share:.23}] },
      { code:'SDU', minutes:44, normalMin:38, delayMin:6, level:'ok',
        segments:[{level:'ok',share:.7},{level:'mid',share:.2},{level:'ok',share:.1}] }
    ]
  };
  function renderTransit(data){
    document.getElementById('routes').innerHTML = data.routes.map(function(r){
      var bar = r.segments.map(function(s){
        return '<i class="lv-' + s.level + '" style="width:' + (s.share * 100) + '%"></i>';
      }).join('');
      return '<div class="route"><span class="code">' + r.code + '</span>' +
        '<div class="bar">' + bar + '</div>' +
        '<span class="mins">' + r.minutes + '<small>min</small></span></div>';
    }).join('');
    var d = new Date(data.updated);
    document.getElementById('trFoot').textContent = (data.routes[0] ? LV[data.routes[0].level] : '') +
      ' · atualizado ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
  }
  function failTransit(){
    document.getElementById('routes').innerHTML = '';
    document.getElementById('trFoot').textContent = 'Trânsito indisponível no momento';
  }
  function loadTransit(){
    fetch('/api/transito', { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(renderTransit)
      .catch(failTransit);
  }

  /* ---------- 4 · Clima ---------- */
  var SUN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#FFC94A"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="#F2971A" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var CLOUD = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.6A3.2 3.2 0 0 0 7 18Z" fill="#B7C0CC"/></svg>';
  var RAIN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.6A3.2 3.2 0 0 0 7 14Z" fill="#8A95A3"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3" stroke="#4E93C9" stroke-width="1.6" stroke-linecap="round"/></svg>';
  function describe(code){
    if (code === 0) return ['Céu limpo', SUN];
    if (code <= 2) return ['Parcialmente nublado', SUN];
    if (code === 3) return ['Nublado', CLOUD];
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return ['Chuva', RAIN];
    return ['Nublado', CLOUD];
  }
  function renderWeather(c){
    var d = describe(c.weather_code);
    document.getElementById('temp').textContent = Math.round(c.temperature_2m);
    document.getElementById('cond').textContent = d[0];
    document.getElementById('icon').innerHTML = d[1];
    document.getElementById('wxMeta').textContent =
      'Sensação ' + Math.round(c.apparent_temperature) + '° · chuva ' + c.precipitation.toFixed(1).replace('.', ',') + ' mm';
  }
  function loadWeather(){
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,apparent_temperature,precipitation,weather_code&timezone=America%2FSao_Paulo';
    fetch(url, { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ renderWeather(j.current); })
      .catch(function(){ document.getElementById('cond').textContent = 'Clima indisponível'; });
  }

  if (DEMO){
    renderTransit(SAMPLE_TR);
    renderWeather({ temperature_2m:23.4, apparent_temperature:23.1, precipitation:0, weather_code:2 });
  } else {
    loadTransit();
    loadWeather();
    setInterval(loadTransit, 5 * 60 * 1000);
    setInterval(loadWeather, 15 * 60 * 1000);
  }
})();
</script>
</body>
</html>
