<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Assistente Infield</title>
<meta name="description" content="Assistente virtual dos participantes do Encontro Infield 2026.">
<link rel="icon" href="img/agente-icone.svg" type="image/svg+xml">
<style>
  @font-face{
    font-family:'Gotham';
    src:url(fonts/gotham-bold.otf) format('opentype');
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --takeda-red:#E1242A;
    --bg:#ffffff;
    --surface:#f4f2f1;
    --text:#1A1A1A;
    --muted:#6b6f76;
    --border:rgba(26,26,26,.10);
    --user-bg:#1A1A1A;
    --user-text:#ffffff;
    --chip-bg:#f3eeec;
    --chip-text:#5b4a48;
    --focus:rgba(225,36,42,.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17181b;
      --surface:#232427;
      --text:#f5f3f2;
      --muted:#a8a4a2;
      --border:rgba(255,255,255,.12);
      --user-bg:#f5f3f2;
      --user-text:#17181b;
      --chip-bg:#2c2426;
      --chip-text:#e8dedc;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  .app{
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;
    max-width:720px;margin:0 auto;
  }

  /* Cabeçalho: faixa vermelha no topo, mesmo sistema do widget */
  header{
    flex:none;
    border-top:4px solid var(--takeda-red);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
    display:flex;align-items:center;gap:12px;
    border-bottom:1px solid var(--border);
  }
  header .title{flex:1;min-width:0;}
  h1{font-family:'Gotham',-apple-system,sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em;}
  header p{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .icon-btn{
    flex:none;width:36px;height:36px;border-radius:50%;
    border:1px solid var(--border);background:transparent;color:var(--text);
    display:grid;place-items:center;cursor:pointer;
  }
  .icon-btn:focus-visible,.chip:focus-visible,#send:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .icon-btn[hidden]{display:none;}

  /* Conversa */
  #log{
    flex:1;overflow-y:auto;overscroll-behavior:contain;
    padding:20px 16px 8px;
    display:flex;flex-direction:column;gap:12px;
  }
  .welcome{margin:auto 0;padding:8px 0 4px;}
  .welcome h2{font-family:'Gotham',-apple-system,sans-serif;font-weight:700;font-size:22px;line-height:1.2;}
  .welcome p{color:var(--muted);font-size:15px;line-height:1.45;margin-top:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .chip{
    border:0;border-radius:999px;padding:9px 14px;
    background:var(--chip-bg);color:var(--chip-text);
    font:inherit;font-size:14px;text-align:left;cursor:pointer;
  }
  .msg{max-width:86%;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere;}
  .msg.user{
    align-self:flex-end;background:var(--user-bg);color:var(--user-text);
    padding:10px 14px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;
  }
  .msg.bot{
    align-self:flex-start;background:var(--surface);
    padding:10px 14px;border-radius:18px 18px 18px 4px;
  }
  .msg.bot p+p,.msg.bot p+ul,.msg.bot ul+p{margin-top:8px;}
  .msg.bot ul{padding-left:18px;}
  .msg.bot li+li{margin-top:4px;}
  .msg.error{align-self:flex-start;color:var(--muted);font-size:14px;}
  .msg.error button{
    margin-left:6px;border:0;background:none;color:var(--takeda-red);
    font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;
  }
  .typing{display:inline-flex;gap:4px;padding:4px 0;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
  @media (prefers-reduced-motion: reduce){.typing i{animation:none;opacity:.6;}}

  /* Campo de pergunta */
  footer{
    flex:none;
    padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top:1px solid var(--border);
    background:var(--bg);
  }
  form{display:flex;align-items:flex-end;gap:8px;}
  textarea{
    flex:1;resize:none;max-height:120px;
    border:1px solid var(--border);border-radius:20px;
    padding:10px 14px;background:var(--surface);color:var(--text);
    font:inherit;font-size:16px;line-height:1.35;
  }
  textarea:focus{outline:none;border-color:var(--takeda-red);box-shadow:0 0 0 3px var(--focus);}
  #send{
    flex:none;width:42px;height:42px;border-radius:50%;border:0;
    background:var(--takeda-red);color:#fff;display:grid;place-items:center;cursor:pointer;
  }
  #send:disabled{opacity:.4;cursor:default;}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <h1>Assistente Infield</h1>
      <p>Encontro Infield 2026</p>
    </div>
    <button class="icon-btn" id="reset" type="button" aria-label="Nova conversa" title="Nova conversa" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <main id="log" aria-live="polite">
    <section class="welcome" id="welcome">
      <h2>Olá! Como posso ajudar?</h2>
      <p>Tire dúvidas sobre o evento, o clima no hotel e o trânsito dos aeroportos até lá.</p>
      <div class="chips">
        <button class="chip" type="button">Como está o trânsito do Galeão até o hotel?</button>
        <button class="chip" type="button">Vai chover nos próximos dias?</button>
        <button class="chip" type="button">Quantos dias faltam para o evento?</button>
        <button class="chip" type="button">Onde vejo meu transfer?</button>
      </div>
    </section>
  </main>

  <footer>
    <form id="form">
      <label class="sr-only" for="input">Sua pergunta</label>
      <textarea id="input" rows="1" maxlength="2000" placeholder="Escreva sua pergunta" enterkeyhint="send"></textarea>
      <button id="send" type="submit" aria-label="Enviar" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </form>
    <p class="note">Respostas geradas por IA. Confirme informações importantes com a organização.</p>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var API = '/api/agente';
  var STORE = 'infield-agente-conversa';
  var log = document.getElementById('log');
  var welcome = document.getElementById('welcome');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var reset = document.getElementById('reset');
  var conversa = [];
  var ocupado = false;

  // Conversa guardada só nesta aba (some ao fechar o app)
  function salvar() { try { sessionStorage.setItem(STORE, JSON.stringify(conversa)); } catch (e) {} }
  function carregar() { try { return JSON.parse(sessionStorage.getItem(STORE)) || []; } catch (e) { return []; } }

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  // Markdown mínimo e seguro: escapa tudo e só então aplica **negrito**, listas e parágrafos
  function formata(texto) {
    var bold = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); };
    var html = '', lista = false;
    texto.split('\n').forEach(function (linha) {
      var item = linha.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
      if (item) {
        if (!lista) { html += '<ul>'; lista = true; }
        html += '<li>' + bold(item[1]) + '</li>';
        return;
      }
      if (lista) { html += '</ul>'; lista = false; }
      if (linha.trim()) html += '<p>' + bold(linha.replace(/^#+\s*/, '')) + '</p>';
    });
    return html + (lista ? '</ul>' : '');
  }

  function rolar() { log.scrollTop = log.scrollHeight; }
  function bolha(role, texto) {
    var el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    if (role === 'user') el.textContent = texto; else el.innerHTML = formata(texto);
    log.appendChild(el);
    return el;
  }
  function estado() {
    welcome.hidden = conversa.length > 0;
    reset.hidden = conversa.length === 0;
    send.disabled = ocupado || !input.value.trim();
  }

  function erro(texto, pergunta) {
    var el = document.createElement('div');
    el.className = 'msg error';
    el.textContent = texto;
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = 'Tentar de novo';
    b.onclick = function () { el.remove(); perguntar(pergunta, true); };
    el.appendChild(b);
    log.appendChild(el);
    rolar();
  }

  function perguntar(texto, repetir) {
    texto = texto.trim();
    if (!texto || ocupado) return;
    ocupado = true;
    if (!repetir) {
      conversa.push({ role: 'user', content: texto });
      bolha('user', texto);
      salvar();
    }
    input.value = ''; ajusta(); estado();

    var el = bolha('bot', '');
    el.innerHTML = '<span class="typing" aria-label="Digitando"><i></i><i></i><i></i></span>';
    rolar();

    var resposta = '';
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensagens: conversa })
    }).then(function (res) {
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      function ler() {
        return reader.read().then(function (r) {
          if (r.done) return;
          resposta += dec.decode(r.value, { stream: true });
          el.innerHTML = formata(resposta);
          rolar();
          return ler();
        });
      }
      return ler();
    }).then(function () {
      if (!resposta.trim()) throw new Error('vazia');
      conversa.push({ role: 'assistant', content: resposta });
      salvar();
    }).catch(function () {
      el.remove();
      erro('Não consegui responder agora.', texto);
    }).then(function () {
      ocupado = false; estado();
    });
  }

  function ajusta() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }

  form.addEventListener('submit', function (e) { e.preventDefault(); perguntar(input.value); });
  input.addEventListener('input', function () { ajusta(); estado(); });
  input.addEventListener('keydown', function (e) {
    // Enter envia no computador; no celular o teclado usa o botão "Enviar"
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover: hover)').matches) {
      e.preventDefault(); perguntar(input.value);
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.addEventListener('click', function () { perguntar(c.textContent); });
  });
  reset.addEventListener('click', function () {
    if (ocupado) return;
    conversa = []; salvar();
    Array.prototype.slice.call(log.querySelectorAll('.msg')).forEach(function (m) { m.remove(); });
    estado(); input.focus();
  });

  conversa = carregar().filter(function (m) { return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string'; });
  conversa.forEach(function (m) { bolha(m.role, m.content); });
  estado(); rolar();
})();
</script>
</body>
</html>
