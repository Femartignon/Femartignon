# Projeto Netlify: infield2026-widgets
# No Netlify, configurar "Base directory" = encontro-infield (este arquivo é lido a partir dela).
[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

# Assistente Infield: a função lê a base de conhecimento (agente/conhecimento.md) em tempo de execução
[functions.agente]
  included_files = ["agente/**"]
