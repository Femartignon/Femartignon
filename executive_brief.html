<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CEO Executive Brief — Mobile Ready</title>
  <script type="module" src="https://unpkg.com/@microsoft/mgt/dist/bundle/mgt.esm.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #fdfdfd;
      margin: 0;
      padding: 24px;
      color: #1a1a1a;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.2rem;
      margin-top: 32px;
      margin-bottom: 12px;
      border-left: 4px solid #222;
      padding-left: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    section {
      margin-bottom: 24px;
    }
    .login {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
    }
    .fallback {
      font-size: 14px;
      color: #999;
      padding-left: 10px;
    }
    .refresh-button {
      padding: 4px 10px;
      font-size: 12px;
      border: none;
      background: #444;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .refresh-button:focus-visible {
      outline: 2px solid #1a1a1a;
      outline-offset: 2px;
    }
    @media (max-width: 600px) {
      body { padding: 16px; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="login">
    <mgt-login></mgt-login>
  </div>

  <h1><span aria-hidden="true">🧬</span> Executive Brief</h1>
  <p><span aria-hidden="true">📆</span> Data: <span id="todayDate">…</span></p>

  <!-- Tasks -->
  <section>
    <h2>
      <span><span aria-hidden="true">📋</span> Tarefas &amp; Prioridades</span>
      <button class="refresh-button" type="button" aria-label="Atualizar tarefas" onclick="refreshComponent('mgt-todo')"><span aria-hidden="true">🔄</span></button>
    </h2>
    <div aria-live="polite">
      <mgt-todo>
        <template data-type="no-data">
          <p class="fallback"><span aria-hidden="true">✅</span> Nenhuma tarefa pendente hoje.</p>
        </template>
      </mgt-todo>
    </div>
  </section>

  <!-- Calendar -->
  <section>
    <h2>
      <span><span aria-hidden="true">📅</span> Reuniões</span>
      <button class="refresh-button" type="button" aria-label="Atualizar reuniões" onclick="refreshComponent('mgt-agenda')"><span aria-hidden="true">🔄</span></button>
    </h2>
    <div aria-live="polite">
      <mgt-agenda group-by-day>
        <template data-type="no-data">
          <p class="fallback"><span aria-hidden="true">📭</span> Nenhuma reunião agendada.</p>
        </template>
      </mgt-agenda>
    </div>
  </section>

  <!-- Emails -->
  <section>
    <h2>
      <span><span aria-hidden="true">📧</span> E-mails importantes</span>
      <button class="refresh-button" type="button" aria-label="Atualizar e-mails" onclick="refreshComponent('mgt-get')"><span aria-hidden="true">🔄</span></button>
    </h2>
    <div aria-live="polite">
      <mgt-get resource="/me/messages?$top=5">
        <template>
          <div style="padding: 10px; border-bottom: 1px solid #eee;">
            <strong>{{subject}}</strong><br />
            <small>De: {{from.emailAddress.name}}</small>
          </div>
        </template>
        <template data-type="no-data">
          <p class="fallback"><span aria-hidden="true">✉️</span> Nenhum e-mail relevante encontrado.</p>
        </template>
      </mgt-get>
    </div>
  </section>

  <!-- Productivity -->
  <section>
    <h2><span aria-hidden="true">🤖</span> Boost de Produtividade</h2>
    <ul>
      <li><span aria-hidden="true">🔝</span> Concentre-se em 1–3 tarefas do To Do acima</li>
      <li><span aria-hidden="true">🕒</span> Horários ideais: 11h–13h, 16h–18h</li>
      <li><span aria-hidden="true">🚧</span> Verifique e-mails por bloqueios pendentes</li>
    </ul>
  </section>

  <script>
    document.getElementById("todayDate").innerText = new Date().toLocaleDateString('pt-BR', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    function refreshComponent(tagName) {
      const old = document.querySelector(tagName);
      const clone = old.cloneNode(true);
      old.replaceWith(clone);
    }
  </script>
</body>
</html>
