<!--
  LATAM Boeing 777-300ER (PT-MUG) — mockup 3D realístico, three.js.

  Um arquivo, sem build, import map via CDN. Servir esta pasta por HTTP:

      cd latam-777-300-mockup && python3 -m http.server 8000
      open http://localhost:8000/

  Abrir direto do disco (file://) NÃO funciona: o navegador bloqueia o
  fetch do .glb a partir de uma página file://. Regra do navegador, não bug.

  Modelo 3D: réplica geométrica original construída a partir de documentos
  dimensionais do fabricante — CC BY 4.0, "LATAM fleet 3D replicas — Kim Lage".
  Origem: https://github.com/kimlage/latam-model-planes
  LATAM e Boeing são marcas de seus respectivos titulares; projeto
  independente, sem afiliação.
-->
<meta charset="utf-8">
<title>LATAM 777-300ER — mockup 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden;
               font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
               color: #e6e7ea; }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 2;
        background: rgba(16,18,24,.82); border: 1px solid #2a2d38;
        border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px);
        max-width: min(90vw, 340px); }
  #ui h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; letter-spacing: .01em; }
  #info { color: #9aa0ae; font-size: 12px; white-space: pre-line; }
  #info b { color: #e6e7ea; font-weight: 600; }
  #credit { position: fixed; bottom: 10px; left: 12px; z-index: 2;
            color: #6b7280; font-size: 11px; }
  a { color: #8fa6ff; }
</style>

<div id="ui">
  <h1>LATAM · Boeing 777-300ER · PT-MUG</h1>
  <div id="info">loading…</div>
</div>
<div id="credit">
  Modelo: <a href="https://github.com/kimlage/latam-model-planes" target="_blank" rel="noopener">Kim Lage — CC BY 4.0</a>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }     from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const URL_MODELO = 'web/B77W_web.glb';

// innerHeight pode ser 0 durante um layout inicial (painel colapsado, split
// de devtools). Dividir por ele entra com NaN no aspect da câmera e no
// enquadramento — uma página preta com números aparentemente corretos.
const larg = () => Math.max(1, innerWidth);
const alt  = () => Math.max(1, innerHeight);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(larg(), alt());
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f14);

// Iluminação baseada em imagem: a pintura clearcoat precisa de algo para
// refletir, senão a pintura da fuselagem parece vinil fosco.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff4e6, 2.2);
sun.position.set(-1, 2.4, 1.6);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x39312a, 0.6));

const camera = new THREE.PerspectiveCamera(35, larg() / alt(), 0.1, 4000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.52; // não deixa ir abaixo do chão

const grid = new THREE.GridHelper(200, 40, 0x2a2d38, 0x191c24);
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

const draco = new DRACOLoader()
  .setDecoderPath('https://unpkg.com/three@0.169.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader().setDRACOLoader(draco);

const info = document.getElementById('info');

function enquadrar(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const mid  = box.getCenter(new THREE.Vector3());
  const r = size.length() / 2;
  const fovY = THREE.MathUtils.degToRad(camera.fov);
  const fovX = 2 * Math.atan(Math.tan(fovY / 2) * (camera.aspect || 1));
  const d = 0.80 * r / Math.sin(Math.min(fovY, fovX) / 2);
  camera.position.set(mid.x - d * 0.62, mid.y + d * 0.26, mid.z + d * 0.72);
  camera.near = d / 100; camera.far = d * 20; camera.updateProjectionMatrix();
  controls.target.copy(mid);
  controls.update();
  grid.position.set(mid.x, box.min.y, mid.z);
  grid.scale.setScalar(Math.max(1, size.x / 60));
  return { size, box };
}

info.textContent = 'loading ' + URL_MODELO + ' …';
loader.load(URL_MODELO, gltf => {
  const modelo = gltf.scene;
  scene.add(modelo);
  const { size, box } = enquadrar(modelo);
  let tris = 0, malhas = 0, mats = new Set();
  modelo.traverse(o => {
    if (!o.isMesh) return;
    malhas++;
    mats.add(o.material.uuid);
    const g = o.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  info.innerHTML =
    `<b>Boeing 777-300ER · PT-MUG</b>\n` +
    `${tris.toLocaleString()} triângulos · ${malhas} malhas · ${mats.size} materiais\n` +
    `${size.x.toFixed(2)} m comprimento · ${size.y.toFixed(2)} m altura · ` +
    `${size.z.toFixed(2)} m envergadura\n` +
    `solo em y = ${box.min.y.toFixed(3)} m\n` +
    `arraste para orbitar · scroll para zoom · botão direito para deslocar`;
}, undefined, err => {
  info.textContent = 'falha ao carregar ' + URL_MODELO + '\n' + err;
});

addEventListener('resize', () => {
  camera.aspect = larg() / alt();
  camera.updateProjectionMatrix();
  renderer.setSize(larg(), alt());
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
